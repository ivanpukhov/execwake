name: Bug report
description: Report a reproducible ExecWake defect
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use private vulnerability reporting from SECURITY.md. Do not attach a session database without reviewing it for sensitive data.
  - type: input
    id: version
    attributes:
      label: ExecWake version
      placeholder: execwake 0.1.0-rc.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Linux distribution, kernel, architecture, and relevant runtime or package-manager versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and input mode
      description: Provide argv, TTY and stdin details, replacing tokens and credentials with placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the child exit code or signal, coverage state, lost-event counts, and exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a local fixture or public package that does not require credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data review
      options:
        - label: I reviewed the report, logs, and screenshots for secrets and private data.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
