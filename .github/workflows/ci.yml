name: CI

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - run: git diff --exit-code -- src/report/assets
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  collector-conformance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
      - name: Mount tracing filesystems
        run: |
          mountpoint -q /sys/kernel/debug || sudo mount -t debugfs debugfs /sys/kernel/debug
          sudo mkdir -p /sys/kernel/debug/tracing
          mountpoint -q /sys/kernel/debug/tracing || sudo mount -t tracefs tracefs /sys/kernel/debug/tracing
      - name: Check Linux collector requirements
        run: sudo scripts/check-linux-collector.sh
      - name: Test ptrace and eBPF collectors
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "RUSTUP_HOME=$(rustup show home)" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            scripts/test-linux-collectors.sh
