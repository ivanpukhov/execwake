name: CI

on:
  push:
  pull_request:

jobs:
  bpf-object:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify embedded eBPF object
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint bash \
            -v "$PWD:/work:ro" \
            -w /work \
            silkeh/clang@sha256:f5ce959d91f059acf5a4b3f1c19f46713c4b2881c7d7cd1d5143ca1d1412277f \
            scripts/verify-bpf-object.sh

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24 runtime
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - run: git diff --exit-code -- src/report/assets
      - run: tests/install_linux.sh
      - run: tests/release_workflow.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: EXECWAKE_FORCE_PTRACE=1 cargo test --all-targets

  ebpf-conformance:
    name: eBPF conformance (${{ matrix.runner }}, ${{ matrix.tier }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.advisory }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            tier: required
            advisory: false
          - runner: ubuntu-24.04
            tier: advisory
            advisory: true
          - runner: ubuntu-22.04-arm
            tier: advisory
            advisory: true
          - runner: ubuntu-24.04-arm
            tier: advisory
            advisory: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
      - name: Mount tracing filesystems
        run: |
          mountpoint -q /sys/kernel/debug || sudo mount -t debugfs debugfs /sys/kernel/debug
          sudo mkdir -p /sys/kernel/debug/tracing
          mountpoint -q /sys/kernel/debug/tracing || sudo mount -t tracefs tracefs /sys/kernel/debug/tracing
      - name: Check Linux collector requirements
        run: sudo scripts/check-linux-collector.sh
      - name: Test eBPF collector
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "RUSTUP_HOME=$(rustup show home)" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            scripts/test-linux-ebpf.sh

  ptrace-conformance:
    name: Ptrace conformance (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
      - name: Test ptrace as an unprivileged user
        run: scripts/test-linux-ptrace.sh

  automatic-collector:
    name: Automatic collector (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
      - name: Mount tracing filesystems
        run: |
          mountpoint -q /sys/kernel/debug || sudo mount -t debugfs debugfs /sys/kernel/debug
          sudo mkdir -p /sys/kernel/debug/tracing
          mountpoint -q /sys/kernel/debug/tracing || sudo mount -t tracefs tracefs /sys/kernel/debug/tracing
      - name: Test automatic fallback after tracepoint attachment fails
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "RUSTUP_HOME=$(rustup show home)" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            EXECWAKE_EXPECT_AUTO_FALLBACK=tracepoint_attach_failed \
            cargo test --test cli_lifecycle \
              automatic_collector_records_a_consistent_decision -- --exact

  package-smoke:
    name: Package smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.67.0
      - name: Build and verify package
        env:
          CARGO_BUILD_JOBS: 2
          EXECWAKE_TARGET: ${{ matrix.target }}
        run: |
          scripts/verify-reproducible-package.sh "$EXECWAKE_TARGET"
      - name: Run packaged binary
        env:
          EXECWAKE_TARGET: ${{ matrix.target }}
          XDG_STATE_HOME: ${{ runner.temp }}/execwake-smoke-state
        run: |
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          package="execwake-v${version}-${EXECWAKE_TARGET}"
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          tar -xzf "dist/$package.tar.gz" -C "$staging" "$package/execwake"
          binary="$staging/$package/execwake"

          "$binary" run -- /usr/bin/true

          set +e
          "$binary" run -- /bin/sh -c 'exit 17'
          status=$?
          set -e
          if (( status != 17 )); then
            echo "Expected exit code 17, got $status." >&2
            exit 1
          fi

          sessions="$XDG_STATE_HOME/execwake/sessions"
          database_count=$(find "$sessions" -maxdepth 1 -type f -name '*.sqlite3' | wc -l)
          marker_count=$(find "$sessions" -maxdepth 1 -type f -name '*.finalized' | wc -l)
          if (( database_count != 2 || marker_count != 2 )); then
            echo "Expected two finalized sessions." >&2
            exit 1
          fi
          if [[ $(stat -c '%a' "$sessions") != 700 ]]; then
            echo "Session directory permissions are not private." >&2
            exit 1
          fi
          while IFS= read -r file; do
            if [[ $(stat -c '%a' "$file") != 600 ]]; then
              echo "Session file permissions are not private: $file" >&2
              exit 1
            fi
          done < <(find "$sessions" -maxdepth 1 -type f -print)
