name: Linux release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            image: rust@sha256:80b9716cb59872769d49f5185a346e5f859081b02338e4aaaa04a8cc7fb884ae
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            image: rust@sha256:7e688b767f8cfc5296f5f73ab17982deeaaeb728f0c719ea9bb974544482d71a
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build Linux package
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          RUST_IMAGE: ${{ matrix.image }}
        run: |
          source_date_epoch=$(git log -1 --format=%ct)
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          archive="dist/execwake-v${version}-${TARGET}.tar.gz"
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          mkdir -p dist
          docker volume create execwake-release-target >/dev/null
          docker run --rm \
            --platform "$PLATFORM" \
            -e "EXECWAKE_TARGET=$TARGET" \
            -e "SOURCE_DATE_EPOCH=$source_date_epoch" \
            -e CARGO_BUILD_JOBS=2 \
            -e CARGO_TARGET_DIR=/target \
            -v "$PWD:/work:ro" \
            -v "$PWD/dist:/work/dist" \
            -v execwake-release-target:/target \
            -w /work \
            "$RUST_IMAGE" \
            scripts/package-linux.sh
      - name: Verify Linux package
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          RUST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$RUST_IMAGE" \
            scripts/verify-linux-package.sh \
            "${{ steps.package.outputs.archive }}" \
            "$TARGET"
      - name: Create SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.package.outputs.archive }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Complete checksum manifest
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          archive_directory=$(dirname -- "$ARCHIVE")
          archive_name=$(basename -- "$ARCHIVE")
          checksum_manifest="$RUNNER_TEMP/$archive_name.sha256"
          (
            cd "$archive_directory"
            sha256sum "$archive_name" "$archive_name.spdx.json" >"$checksum_manifest"
            sha256sum --check "$checksum_manifest"
          )
          mv -f -- "$checksum_manifest" "$ARCHIVE.sha256"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify checksum manifest
        env:
          CHECKSUM: ${{ steps.package.outputs.archive }}.sha256
        run: |
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          bundle="$CHECKSUM.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$CHECKSUM"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CHECKSUM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execwake-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.archive }}.sha256.sigstore.json
            ${{ steps.package.outputs.archive }}.spdx.json
          if-no-files-found: error
