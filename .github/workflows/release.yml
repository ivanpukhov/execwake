name: Linux release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            image: rust@sha256:80b9716cb59872769d49f5185a346e5f859081b02338e4aaaa04a8cc7fb884ae
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            image: rust@sha256:7e688b767f8cfc5296f5f73ab17982deeaaeb728f0c719ea9bb974544482d71a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Linux package
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          RUST_IMAGE: ${{ matrix.image }}
        run: |
          source_date_epoch=$(git log -1 --format=%ct)
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          archive="dist/execwake-v${version}-${TARGET}.tar.gz"
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          mkdir -p dist
          docker run --rm \
            --platform "$PLATFORM" \
            -e "SOURCE_DATE_EPOCH=$source_date_epoch" \
            -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/work:ro" \
            -v "$PWD/dist:/work/dist" \
            -w /work \
            "$RUST_IMAGE" \
            scripts/verify-reproducible-package.sh "$TARGET"
      - name: Verify Linux package
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          RUST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$RUST_IMAGE" \
            scripts/verify-linux-package.sh \
            "${{ steps.package.outputs.archive }}" \
            "$TARGET"
      - name: Verify glibc baseline and Debian 12 runtime
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: scripts/verify-linux-compatibility.sh "$ARCHIVE" "$TARGET" "$PLATFORM"
      - name: Create SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.package.outputs.archive }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Complete checksum manifest
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          archive_directory=$(dirname -- "$ARCHIVE")
          archive_name=$(basename -- "$ARCHIVE")
          checksum_manifest="$RUNNER_TEMP/$archive_name.sha256"
          (
            cd "$archive_directory"
            sha256sum "$archive_name" "$archive_name.spdx.json" >"$checksum_manifest"
            sha256sum --check "$checksum_manifest"
          )
          mv -f -- "$checksum_manifest" "$ARCHIVE.sha256"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify checksum manifest
        env:
          CHECKSUM: ${{ steps.package.outputs.archive }}.sha256
        run: |
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          bundle="$CHECKSUM.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$CHECKSUM"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CHECKSUM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execwake-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.archive }}.sha256.sigstore.json
            ${{ steps.package.outputs.archive }}.spdx.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: execwake-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify release files
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ -z "$version" || "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Release tags must start with v." >&2
            exit 1
          fi

          targets=(x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu)
          suffixes=(tar.gz tar.gz.sha256 tar.gz.sha256.sigstore.json tar.gz.spdx.json)
          expected_files=0
          for target in "${targets[@]}"; do
            archive="execwake-v${version}-${target}.tar.gz"
            for suffix in "${suffixes[@]}"; do
              file="dist/execwake-v${version}-${target}.${suffix}"
              if [[ ! -s "$file" ]]; then
                echo "Missing release file: $file" >&2
                exit 1
              fi
              expected_files=$((expected_files + 1))
            done

            checksum="$archive.sha256"
            (
              cd dist
              sha256sum --check "$checksum"
            )

            identity="https://github.com/$GITHUB_WORKFLOW_REF"
            cosign verify-blob \
              --bundle "dist/$checksum.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "dist/$checksum"
          done

          actual_files=$(find dist -maxdepth 1 -type f | wc -l)
          if (( actual_files != expected_files )); then
            echo "Expected $expected_files release files, found $actual_files." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            dist/*
            --verify-tag
            --title "ExecWake $GITHUB_REF_NAME"
            --notes "Linux artifacts for x86_64 and arm64. Verify the checksum manifest and Sigstore bundle before installation."
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
