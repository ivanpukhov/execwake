[package]
name = "execwake"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
license = "MIT"
description = "Record the observable side effects of a command"

[dependencies]
atty = "=0.2.14"
axum = { version = "=0.6.20", default-features = false, features = ["http1", "json", "query", "tokio"] }
fs2 = "=0.4.3"
getrandom = "0.2.16"
libc = "0.2.189"
rusqlite = { version = "=0.29.0", features = ["bundled", "limits"] }
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"
tokio = { version = "=1.32.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.17"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "=0.11.0"
bytes = "=1.4.0"

[[test]]
name = "conformance"
path = "tests/fixtures/conformance.rs"
harness = false
