[package]
name = "execwake"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
license = "MIT"
description = "Record the observable side effects of a command"

[dependencies]
fs2 = "=0.4.3"
getrandom = "0.2.16"
libc = "0.2.189"
rusqlite = { version = "=0.29.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.17"

[[test]]
name = "conformance"
path = "tests/fixtures/conformance.rs"
harness = false
